services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: docintake
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: docintake
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintake -d docintake"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: