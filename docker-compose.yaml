services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: docintake
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: docintake
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintake -d docintake"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3mock:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: documents
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3mockdata:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      retries: 3

  # The API itself, built from the Dockerfile. Off by default so day-to-day F5 debugging only starts the dependencies.
  # Start everything with:  docker compose --profile app up --build
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=docintake;Username=docintake;Password=dev-only-password"
      Storage__BucketName: documents
      Storage__ServiceUrl: http://s3mock:9090
      Storage__AccessKey: dev
      Storage__SecretKey: dev-only
      Database__MigrateOnStartup: "true"
      # Token validation settings, normally read from appsettings.Development.json (not in the image) and user secrets.
      Authentication__Schemes__Bearer__ValidIssuer: dotnet-user-jwts
      Authentication__Schemes__Bearer__ValidAudiences__0: http://localhost:5237
      Authentication__Schemes__Bearer__ValidAudiences__1: https://localhost:7065
    # The dev signing key comes from a git-ignored .env file in this folder. Never commit it.
    env_file:
      - path: .env
        required: false

volumes:
  pgdata:
  s3mockdata: